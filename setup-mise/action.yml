name: "Setup mise (pinned)"
description: >-
  jdx/mise-action を薄くラップし、mise 本体のバージョンをこの action 側だけで一元固定する。
  利用側リポジトリは version 追従を意識せず mise をセットアップできる。
inputs:
  cache:
    description: "jdx/mise-action の cache 入力をそのまま渡す"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    # version 固定の理由: GitHub が 2026年6月末に Sigstore TSA 証明書をローテーションし、
    # それ以前の mise (~2026.6.14 系、mise-action@v4.2.0 が既定で解決する版) は新証明書での
    # attestation 検証ができず "TSA timestamp verification failed" で fail する。
    # 2026.7.0 で mise 側の検証ライブラリ (sigstore-verify) が追従し解消した。
    # 版を上げる時はここ1箇所を書き換えてタグを打つだけでよい (利用側は変更不要)。
    - name: Setup mise
      uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      with:
        version: 2026.7.0
        cache: ${{ inputs.cache }}
