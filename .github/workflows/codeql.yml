# CodeQL による継続的セキュリティスキャン(GitHub Actions ワークフロー / composite action)。
# languages: actions は run: 内スクリプトや ${{ }} 式への信頼できない入力混入
# (script injection)等、workflow 特有のデータフロー/taint を検出する。
# Code Scanning は public リポジトリでのみ有効(private だと SARIF アップロードが fail する)。
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # 毎週月曜 03:17 UTC

permissions:
  contents: read

# 同一 ref への連続 push では古い run をキャンセルし、無駄な実行を避ける。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # SARIF を Code Scanning へアップロードするため
      contents: read
      actions: read # CodeQL Action が workflow run 情報を参照するため必須
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: actions
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: "/language:actions"
